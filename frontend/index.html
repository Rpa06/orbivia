<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orbivia · Salud de la tripulación</title>
    <link rel="stylesheet" href="assets/app.css">
  </head>
  <body>
    <aside class="sidebar" id="sidebar" hidden>
      <div class="logo"><div class="logo-mark"></div>Orbivia</div>
      <nav id="nav" aria-label="Secciones"></nav>
      <div class="orbit" id="orbit"></div>
    </aside>

    <main>
      <header class="top" id="top" hidden>
        <div>
          <h1 id="title">Orbivia</h1>
          <p><span id="subtitle"></span> · <span id="clock"></span></p>
        </div>
        <div class="mission" id="pills"></div>
      </header>
      <div id="view"></div>
      <footer>Datos simulados de demostración · Orbivia no diagnostica ni trata enfermedades: propone, y la decisión final es siempre de una persona.</footer>
    </main>

    <div class="toast" id="toast"></div>
    <script type="module" src="assets/app.js"></script>
  </body>
</html>
