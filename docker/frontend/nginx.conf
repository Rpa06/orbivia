server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 13m;

    # Sin registro de cuerpos ni de cabeceras de autorización
    access_log /var/log/nginx/access.log;

    # DNS interno de Docker: la IP de la API se resuelve en cada petición, así un
    # reinicio de la API no deja a Nginx apuntando a una dirección antigua
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;
        add_header Permissions-Policy "camera=(self), microphone=(self)";
    }
}
